[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileclassifier"
version = "1.0.0"
description = "Excel query-driven file retrieval backend API and services"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "fileclassifier contributors" },
]
keywords = ["excel", "fastapi", "file-matching", "automation", "backend"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]
web = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
fileclassifier-api = "fileclassifier.webapi.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
