name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./fileclassifier-python-api[dev]"

      - name: Lint
        run: python -m ruff check fileclassifier-python-api/src fileclassifier-python-api/tests fileclassifier-python-api/scripts fileclassifier-python-api/start_web.py

      - name: Test
        run: python -m pytest fileclassifier-python-api/tests
